<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="#131c31" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.35" />

  <!-- Center Glow -->
  <circle cx="256" cy="230" r="140" fill="#2563eb" fill-opacity="0.25" filter="blur(20px)" />

  <!-- Ticket Body with Clay Effect -->
  <g filter="url(#clayShadow)">
    <rect x="136" y="140" width="240" height="160" rx="28" fill="url(#ticketGrad)" stroke="#60a5fa" stroke-width="4" />
    
    <!-- Left ticket punch notches -->
    <circle cx="136" cy="220" r="16" fill="#131c31" />
    <circle cx="376" cy="220" r="16" fill="#131c31" />

    <!-- Dashed Ticket Separator -->
    <line x1="206" y1="155" x2="206" y2="285" stroke="#bfdbfe" stroke-width="2.5" stroke-dasharray="6,6" stroke-opacity="0.7" />

    <!-- Checkmark Icon on Left Stub -->
    <path d="M160 220 L170 230 L188 210" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- AP Typography on Right Stub -->
    <!-- Letter A -->
    <path d="M245 265 L265 178 L285 265 M252 238 L278 238" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letter P -->
    <path d="M305 265 L305 178 L330 178 C345 178 345 220 330 220 L305 220" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Status Live Ping Dot -->
    <circle cx="366" cy="150" r="12" fill="#10b981" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Bottom Clay Pill: ASIA PLASTIK -->
  <g filter="url(#clayShadow)">
    <rect x="116" y="325" width="280" height="54" rx="20" fill="url(#badgeGrad)" stroke="#fda4af" stroke-width="2.5" />
    <text x="256" y="360" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">ASIA PLASTIK</text>
  </g>
</svg>